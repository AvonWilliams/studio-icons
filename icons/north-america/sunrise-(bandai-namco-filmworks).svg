<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="#FFFFFFE6" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"> <!-- Horizon --> <line x1="2" y1="18" x2="22" y2="18" /> <!-- Rising sun semi-circle: centre (12,18), radius 7 --> <path d="M 5 18 A 7 7 0 0 1 19 18" /> <!-- Sun rays --> <line x1="12" y1="11" x2="12" y2="5" /> <line x1="8.5" y1="12" x2="5.5" y2="7" /> <line x1="15.5" y1="12" x2="18.5" y2="7" /> <!-- Subtle interior fill for the sun disc --> <path d="M 5 18 A 7 7 0 0 1 19 18 Z" fill="#FFFFFFE6" stroke="none" opacity="0.12" /> <!-- Brand accent wash: #CC0000 at 0.12 opacity --> <g stroke="#CC0000" stroke-width="1.5" opacity="0.12"> <line x1="2" y1="18" x2="22" y2="18" /> <path d="M 5 18 A 7 7 0 0 1 19 18" /> <line x1="12" y1="11" x2="12" y2="5" /> <line x1="8.5" y1="12" x2="5.5" y2="7" /> <line x1="15.5" y1="12" x2="18.5" y2="7" /> </g> </svg>