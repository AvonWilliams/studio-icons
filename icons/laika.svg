<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="#FFFFFFE6" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"> <!-- Marionette control bar: top grip --> <line x1="4" y1="4" x2="20" y2="4" /> <!-- Marionette control bar: cross piece --> <line x1="6" y1="7.5" x2="18" y2="7.5" /> <!-- Marionette control bar: center connector --> <line x1="12" y1="4" x2="12" y2="7.5" /> <!-- Puppet strings from cross bar --> <line x1="6" y1="7.5" x2="7.5" y2="14" /> <line x1="9.5" y1="7.5" x2="10" y2="13" /> <line x1="14.5" y1="7.5" x2="14" y2="13" /> <line x1="18" y1="7.5" x2="16.5" y2="14" /> <!-- Puppet head --> <circle cx="12" cy="15" r="1.2" /> <!-- Puppet body --> <line x1="12" y1="16.2" x2="12" y2="19" /> <!-- Puppet arms (jointed elbows - signature stop-motion armature look) --> <polyline points="9,17.5 12,17 15,17.5" /> <!-- Puppet legs --> <line x1="12" y1="19" x2="10.5" y2="21" /> <line x1="12" y1="19" x2="13.5" y2="21" /> <!-- Subtle interior fill for puppet body --> <g fill="#FFFFFFE6" opacity="0.12" stroke="none"> <circle cx="12" cy="15" r="1.2" /> <rect x="10.8" y="16.2" width="2.4" height="2.8" rx="0.3" /> </g> <!-- Brand accent wash: Laika red --> <g stroke="#D12728" opacity="0.14" fill="none"> <line x1="4" y1="4" x2="20" y2="4" /> <line x1="6" y1="7.5" x2="18" y2="7.5" /> <line x1="12" y1="4" x2="12" y2="7.5" /> <line x1="6" y1="7.5" x2="7.5" y2="14" /> <line x1="9.5" y1="7.5" x2="10" y2="13" /> <line x1="14.5" y1="7.5" x2="14" y2="13" /> <line x1="18" y1="7.5" x2="16.5" y2="14" /> <circle cx="12" cy="15" r="1.2" /> <line x1="12" y1="16.2" x2="12" y2="19" /> <polyline points="9,17.5 12,17 15,17.5" /> <line x1="12" y1="19" x2="10.5" y2="21" /> <line x1="12" y1="19" x2="13.5" y2="21" /> </g> </svg>