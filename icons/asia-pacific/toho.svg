<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="#FFFFFFE6" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"> <!-- Brand accent: subtle #0033A0 fill behind the emblem --> <circle cx="12" cy="12" r="9" fill="#0033A0" opacity="0.14" stroke="none" /> <!-- Outer circle — the dominant silhouette boundary --> <circle cx="12" cy="12" r="9" /> <!-- T emblem: vertical stem --> <line x1="12" y1="4" x2="12" y2="19" /> <!-- T emblem: upper crossbar (wider) --> <line x1="5.5" y1="6" x2="18.5" y2="6" /> <!-- T emblem: lower crossbar (narrower, characteristic of Toho's logo) --> <line x1="7.5" y1="10" x2="16.5" y2="10" /> </svg>